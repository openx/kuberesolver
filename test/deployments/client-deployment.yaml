apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: grpc-test-client:latest
          imagePullPolicy: Never
      serviceAccountName: client
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: default
  labels:
    app: client
spec:
  selector:
    app: client
  ports:
    - port: 50052
      targetPort: 50052
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: client
  namespace: default
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: client
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: client
subjects:
  - kind: ServiceAccount
    name: client
    namespace: default